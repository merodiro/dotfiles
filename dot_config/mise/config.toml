[settings]
experimental = true

[bootstrap.packages]
# Unprefixed: mise picks apt/dnf/pacman/zypper/apk, whichever is available.
# macOS ships zsh at /bin/zsh, so no package is needed there.
zsh = { os = "linux" }

[bootstrap.user]
login_shell = "zsh"

[tools]
bob = "latest"
eza = "latest"
starship = "latest"
ripgrep = "latest"
zellij = "latest"
lazygit = "latest"
bat-extras = "latest"
bat = "latest"
difftastic = "latest"
delta = "latest"
fzf = "latest"
zoxide = "latest"
atuin = "latest"
usage = "latest"
"forgejo:mergiraf/mergiraf" = "latest"
